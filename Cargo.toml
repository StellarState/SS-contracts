    "contracts/batch-settlement",
    "contracts/bulk-listing",
    "contracts/categorisation-registry",
    "contracts/collateral",
    "contracts/dividend-reinvestment",
    "contracts/document-cid-registry",
    "contracts/early-repayment",
    "contracts/fee-discount",
    "contracts/fee-treasury",
    "contracts/grace-interest",
    "contracts/interest-rate-oracle",
    "contracts/investment-limit",
    "contracts/investor-notifications",
    "contracts/investor-scoring",
    "contracts/invoice-amendment",
    "contracts/invoice-co-investment",
    "contracts/invoice-escrow",
    "contracts/invoice-issuer-verification",
    "contracts/invoice-maturity",
    "contracts/invoice-metadata-registry",
    "contracts/invoice-pool",
    "contracts/invoice-refund",
    "contracts/invoice-settlement",
    "contracts/invoice-snapshot",
    "contracts/invoice-token",
    "contracts/kyc-whitelist",
    "contracts/loyalty-tier",
    "contracts/multisig-admin",
    "contracts/nonce-registry",
    "contracts/onboarding-bonus",
    "contracts/order-book",
    "contracts/partial-settlement",
    "contracts/payment-distributor",
    "contracts/secondary-market",
    "contracts/secondary-trade-history",
    "contracts/staking-rewards",
    "contracts/treasury-management",
    "contracts/twap-oracle",
    "contracts/price-stabilisation",
    "contracts/accreditation-renewal",
    "contracts/portfolio-nav-snapshot",
    "contracts/invoice-tranche",
    "contracts/invoice-performance-alert",
    "contracts/investor-portfolio-health",
    "contracts/invoice-co-investment-pool",
    "contracts/invoice-hardship-extension",
]

[workspace.dependencies]
soroban-sdk = "27.0.2"
soroban-env-host = "27.0.2"
proptest = "1"

[profile.release]
opt-level = "z"
strip = "symbols"
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"
