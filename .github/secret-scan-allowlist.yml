# Secret Scanning Allowlist Configuration
#
# This file defines exceptions for secret scanning. Each entry MUST include:
# - pattern: The regex pattern to allow (without the actual secret value)
# - issue_id: Reference to the tracking issue/ticket (format: #123, PROJ-456, or GitHub issue URL)
# - expires: Expiration date in YYYY-MM-DD format
# - owner: GitHub username or team responsible for review
# - description: Human-readable explanation of why this exception exists
#
# IMPORTANT: Never include actual secret values in this file!
# The secret_value field is explicitly prohibited and will cause validation to fail.

allowlist:
  - pattern: "ghp_[a-zA-Z0-9]{36}"
    issue_id: "#780"
    expires: "2027-05-20"
    owner: "TS-mfon"
    description: "GitHub Personal Access Token pattern for CI/CD automation"

  - pattern: "sk_live_[a-zA-Z0-9]{24}"
    issue_id: "#780"
    expires: "2027-05-20"
    owner: "TS-mfon"
    description: "Stripe live secret key pattern for payment integration"

  - pattern: "AKIA[0-9A-Z]{16}"
    issue_id: "#780"
    expires: "2027-05-20"
    owner: "TS-mfon"
    description: "AWS Access Key ID pattern for cloud infrastructure"

# Example of a properly documented exception with all required fields:
# - pattern: "your-pattern-here"
#   issue_id: "#1234"
#   expires: "2026-12-31"
#   owner: "github-username"
#   description: "Clear explanation of the exception purpose"