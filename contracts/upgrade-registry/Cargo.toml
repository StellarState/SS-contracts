[package]
name = "upgrade-registry"
version = "0.1.0"
edition = "2021"
publish = false
description = "Platform upgrade registry contract for versioned contract migrations"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
